<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conecta 193 - Ocorrências</title>
  <style>
    :root { 
      --primary: #1a73e8; 
      --bg: #000000; 
      --card: #111111; 
      --text: #ffffff; 
      --border: #333333; 
      --error: #ff5252; 
      --success: #4caf50;
      --warning: #ff9800;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 4px 12px rgba(255,255,255,0.05); }
    .header { text-align: center; margin-bottom: 15px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
    .header h2 { color: var(--primary); }
    
    .prof-badge { background: #1c2b3e; color: #64b5f6; padding: 10px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    
    /* MENU DE NAVEGAÇÃO SUPERIOR */
    .nav-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
    .nav-btn { flex: 1; padding: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; font-weight: 600; cursor: pointer; text-align: center; }
    .nav-btn.active { background: var(--primary); border-color: var(--primary); }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 5px; color: #ccc; }
    input, select, textarea { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 0.95rem; }
    
    .checkbox-group { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 10px 8px; 
      margin-top: 8px; 
    }
    .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #eee; }
    .checkbox-item input { width: auto; }
    
    button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
    button:disabled { background: #444; color: #888; }
    .btn-sair { background: transparent; color: var(--error); border: none; font-size: 0.85rem; cursor: pointer; width: auto; margin: 0; }

    .screen { display: none; }
    .screen.active { display: block; }
    .msg { padding: 10px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 12px; display: none; }
    .msg.error { background: #3c1414; color: var(--error); border: 1px solid var(--error); display: block; }
    .msg.success { background: #143c1a; color: var(--success); border: 1px solid var(--success); display: block; }

    /* GRUPO DE DATA NO HISTÓRICO */
    .data-group-header { background: #1c2b3e; padding: 8px 12px; border-radius: 6px; font-weight: bold; color: #64b5f6; margin: 15px 0 10px 0; font-size: 0.92rem; border-left: 4px solid var(--primary); }

    /* CARDS DE OCORRÊNCIA */
    .ocorrencia-card { background: #181818; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .ocorrencia-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 0.95rem; color: #fff; margin-bottom: 6px; }
    .ocorrencia-meta { font-size: 0.8rem; color: #888; margin-bottom: 6px; }
    .ocorrencia-tipo { font-size: 0.88rem; color: #ffca28; margin-bottom: 6px; }
    .ocorrencia-obs { font-size: 0.85rem; color: #ccc; background: #222; padding: 6px; border-radius: 4px; margin-bottom: 8px; }
    
    .card-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .btn-action { padding: 6px 10px; font-size: 0.78rem; border-radius: 4px; border: none; cursor: pointer; font-weight: 600; width: auto; margin: 0; }
    .btn-detalhes { background: #0288d1; color: white; }
    .btn-editar { background: var(--warning); color: black; }
    .btn-apagar { background: var(--error); color: white; }

    /* POP-UP / MODAL DE CONFIRMAÇÃO E DETALHES */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: #1e1e1e; border: 1px solid #444; border-radius: 10px; width: 90%; max-width: 400px; padding: 20px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .modal-box h3 { margin-bottom: 12px; color: var(--primary); }
    .modal-box p { font-size: 0.9rem; color: #ddd; margin-bottom: 18px; line-height: 1.4; }
    .modal-buttons { display: flex; gap: 10px; }
    
    .back-link { display: block; text-align: center; margin-top: 15px; color: #00ff00; text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- TELA 1: LOGIN -->
  <div id="screen-login" class="screen active">
    <div class="header">
      <h2>Conecta 193</h2>
      <p style="font-size: 0.85rem; color: #aaa;">Acesso do Professor</p>
    </div>
    <div id="login-msg" class="msg"></div>
    <form onsubmit="event.preventDefault(); fazerLogin();">
      <div class="form-group">
        <label for="matricula">Matrícula:</label>
        <input type="text" id="matricula" placeholder="Digite sua matrícula" required>
      </div>
      <button type="submit" id="btn-login">Entrar</button>
    </form>
  </div>

  <!-- TELA PRINCIPAL (APÓS LOGIN) -->
  <div id="screen-main" class="screen">
    <div class="header">
      <h2>Conecta 193</h2>
    </div>

    <div class="prof-badge">
      <span>Prof: <strong id="prof-nome">---</strong></span>
      <button type="button" class="btn-sair" onclick="sair()">Sair</button>
    </div>

    <!-- BOTÕES DE NAVEGAÇÃO SUPERIORES (NOVA É A TELA INICIAL) -->
    <div class="nav-buttons">
      <button type="button" class="nav-btn active" id="btn-tab-nova" onclick="alternarAba('nova')">+ Nova</button>
      <button type="button" class="nav-btn" id="btn-tab-hoje" onclick="alternarAba('hoje')">Hoje</button>
      <button type="button" class="nav-btn" id="btn-tab-historico" onclick="alternarAba('historico')">Histórico</button>
    </div>

    <div id="main-msg" class="msg"></div>

    <!-- ABA 1: FORMULÁRIO DE NOVA OCORRÊNCIA (TELA INICIAL PADRÃO) -->
    <div id="tab-nova" class="tab-content">
      <form id="form-ocorrencia" onsubmit="event.preventDefault(); enviarOcorrencia();">
        <input type="hidden" id="edit-id" value="">
        <div class="form-group">
          <label for="data_hora">Data e Hora:</label>
          <input type="datetime-local" id="data_hora" required>
        </div>

        <div class="form-group">
          <label for="turma">Turma:</label>
          <select id="turma" onchange="carregarDisciplinasEAlunos()" required>
            <option value="">Selecione a Turma...</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="materia">Matéria:</label>
          <select id="materia" required disabled>
            <option value="">Selecione a Turma primeiro...</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="aluno">Aluno:</label>
          <select id="aluno" required disabled>
            <option value="">Selecione a Turma primeiro...</option>
          </select>
        </div>
        
<div class="form-group">
          <label>Motivo da Ocorrência:</label>
          <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Chegou atrasado"> Chegou atrasado</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Sem dever (casa/aula)"> Sem dever (casa/aula)</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Dever incompleto (casa/aula)"> Dever incompleto (casa/aula)</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Sem material de estudo"> Sem material de estudo</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Não entregou trabalho"> Não entregou trabalho</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Excesso de conversas"> Excesso de conversas</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Utilização de celular/fone em sala"> Utilização de celular/fone em sala</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Brigou em sala de aula"> Brigou em sala de aula</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Falta de respeito (colegas)"> Falta de respeito (colegas)</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Falta de respeito (professor)"> Falta de respeito (professor)</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Palavras inadequadas"> Palavras inadequadas</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Não acata ordens (professor)"> Não acata ordens (professor)</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Destruição de patrimônio público"> Destruição de patrimônio público</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Falta sem justificativa"> Falta sem justificativa</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Elogios / Pontos positivos"> Elogios / Pontos positivos</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Recusou participar da atividade"> Recusou participar da atividade</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Matando aula"> Matando aula</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Jogando no celular"> Jogando no celular</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Jogando no Chromebook"> Jogando no Chromebook</label>
          </div>
        </div>
        
        <div class="form-group">
          <label for="observacao">Observação:</label>
          <textarea id="observacao" rows="3" placeholder="Detalhes opcionais..."></textarea>
        </div>
        
        <button type="submit" id="btn-salvar">Registrar Ocorrência</button>
      </form>
    </div>

    <!-- ABA 2: HOJE (OCORRÊNCIAS DO DIA VIGENTE) -->
    <div id="tab-hoje" class="tab-content" style="display: none;">
      <h3 style="font-size: 1rem; color: #888; margin-bottom: 10px;">Ocorrências de Hoje</h3>
      <div id="lista-hoje">Carregando ocorrências de hoje...</div>
    </div>

    <!-- ABA 3: HISTÓRICO COMPLETO AGRUPADO POR DATA -->
    <div id="tab-historico" class="tab-content" style="display: none;">
      <h3 style="font-size: 1rem; color: #888; margin-bottom: 10px;">Histórico Geral</h3>
      <div id="lista-historico">Carregando histórico...</div>
    </div>

  </div>

  
</div>

<!-- MODAL / POP-UP CUSTOMIZADO -->
<div id="modal" class="modal-overlay">
  <div class="modal-box">
    <h3 id="modal-titulo">Confirmação</h3>
    <p id="modal-texto">Mensagem aqui...</p>
    <div class="modal-buttons" id="modal-acoes">
      <button type="button" onclick="fecharModal()">OK</button>
    </div>
  </div>
</div>

<script>
  // COLE AQUI A SUA URL DO APPS SCRIPT
  const API_URL = "https://script.google.com/macros/s/AKfycbyGvBbmspX6HpqarZCqhsGt0If4y4n86wMVLUT31rXJtr-KDwhISkJvhZXuKvMz9DhwNg/exec"; 

  let dadosSessao = null;
  let cacheOcorrencias = [];

  function obterDataHoraAtualLocal() {
    const agora = new Date();
    const ano = agora.getFullYear();
    const mes = String(agora.getMonth() + 1).padStart(2, '0');
    const dia = String(agora.getDate()).padStart(2, '0');
    const horas = String(agora.getHours()).padStart(2, '0');
    const minutos = String(agora.getMinutes()).padStart(2, '0');
    return `${ano}-${mes}-${dia}T${horas}:${minutos}`;
  }

  function formatarDataParaEnvio(isoString) {
    if (!isoString) return '';
    const d = new Date(isoString);
    const dia = String(d.getDate()).padStart(2, '0');
    const mes = String(d.getMonth() + 1).padStart(2, '0');
    const ano = d.getFullYear();
    const horas = String(d.getHours()).padStart(2, '0');
    const minutos = String(d.getMinutes()).padStart(2, '0');
    return `${dia}/${mes}/${ano}, ${horas}:${minutos}`;
  }

  function mostrarMsg(id, texto, tipo) {
    const el = document.getElementById(id);
    el.innerText = texto;
    el.className = 'msg ' + tipo;
  }

  function limparMsg(id) {
    const el = document.getElementById(id);
    el.innerText = '';
    el.className = 'msg';
  }

  function abrirModal(titulo, texto, acoesHtml = null) {
    document.getElementById('modal-titulo').innerText = titulo;
    document.getElementById('modal-texto').innerHTML = texto;
    const divAcoes = document.getElementById('modal-acoes');
    if (acoesHtml) {
      divAcoes.innerHTML = acoesHtml;
    } else {
      divAcoes.innerHTML = '<button type="button" onclick="fecharModal()">OK</button>';
    }
    document.getElementById('modal').classList.add('active');
  }

  function fecharModal() {
    document.getElementById('modal').classList.remove('active');
  }

  async function fazerLogin() {
    const mat = document.getElementById('matricula').value.trim();
    if (!mat) return;

    const btn = document.getElementById('btn-login');
    btn.disabled = true;
    btn.innerText = 'Buscando...';
    limparMsg('login-msg');

    try {
      const resp = await fetch(`${API_URL}?action=validarMatricula&matricula=${encodeURIComponent(mat)}`, {
        method: 'GET',
        redirect: 'follow'
      });
      const res = await resp.json();
      btn.disabled = false;
      btn.innerText = 'Entrar';

      if (res.sucesso) {
        dadosSessao = res;
        iniciarMain();
      } else {
        mostrarMsg('login-msg', res.mensagem, 'error');
      }
    } catch (e) {
      btn.disabled = false;
      btn.innerText = 'Entrar';
      mostrarMsg('login-msg', 'Erro de conexão com o servidor.', 'error');
    }
  }

  function iniciarMain() {
    document.getElementById('screen-login').classList.remove('active');
    document.getElementById('screen-main').classList.add('active');
    document.getElementById('prof-nome').innerText = dadosSessao.professor;
    
    const selectTurma = document.getElementById('turma');
    selectTurma.innerHTML = '<option value="">Selecione a Turma...</option>';
    dadosSessao.turmas.sort().forEach(t => {
      selectTurma.innerHTML += `<option value="${t}">${t}</option>`;
    });

    // Inicia diretamente na aba "+ Nova"
    alternarAba('nova');
  }

  function alternarAba(aba) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');

    if (aba === 'nova') {
      document.getElementById('btn-tab-nova').classList.add('active');
      document.getElementById('tab-nova').style.display = 'block';
      document.getElementById('edit-id').value = '';
      document.getElementById('btn-salvar').innerText = 'Registrar Ocorrência';
      document.getElementById('data_hora').value = obterDataHoraAtualLocal();
    } else if (aba === 'hoje') {
      document.getElementById('btn-tab-hoje').classList.add('active');
      document.getElementById('tab-hoje').style.display = 'block';
      carregarOcorrenciasHoje();
    } else if (aba === 'historico') {
      document.getElementById('btn-tab-historico').classList.add('active');
      document.getElementById('tab-historico').style.display = 'block';
      carregarHistoricoCompleto();
    }
  }

  async function carregarOcorrenciasHoje() {
    const div = document.getElementById('lista-hoje');
    div.innerHTML = 'Carregando ocorrências de hoje...';

    try {
      const resp = await fetch(`${API_URL}?action=obterOcorrenciasDia&professor=${encodeURIComponent(dadosSessao.professor)}`, {
        method: 'GET',
        redirect: 'follow'
      });
      const res = await resp.json();

      if (res.sucesso && res.dados.length > 0) {
        cacheOcorrencias = res.dados;
        div.innerHTML = renderizarOcorrenciasAgrupadas(res.dados);
      } else {
        div.innerHTML = '<p style="color:#888; font-size:0.9rem;">Nenhuma ocorrência registrada hoje.</p>';
      }
    } catch (e) {
      div.innerHTML = '<p style="color:var(--error);">Erro ao carregar ocorrências de hoje.</p>';
    }
  }

  async function carregarHistoricoCompleto() {
    const div = document.getElementById('lista-historico');
    div.innerHTML = 'Carregando histórico...';

    try {
      const resp = await fetch(`${API_URL}?action=obterHistoricoCompleto`, {
        method: 'GET',
        redirect: 'follow'
      });
      const res = await resp.json();

      if (res.sucesso && res.dados.length > 0) {
        cacheOcorrencias = res.dados;
        div.innerHTML = renderizarOcorrenciasAgrupadas(res.dados);
      } else {
        div.innerHTML = '<p style="color:#888; font-size:0.9rem;">Nenhum registro encontrado no histórico.</p>';
      }
    } catch (e) {
      div.innerHTML = '<p style="color:var(--error);">Erro ao carregar histórico.</p>';
    }
  }

  function renderizarOcorrenciasAgrupadas(lista) {
    let grupos = {};
    lista.forEach(item => {
      let dt = item.data_curta || 'Outras Datas';
      if (!grupos[dt]) grupos[dt] = [];
      grupos[dt].push(item);
    });

    let html = '';
    let profLogado = (dadosSessao && dadosSessao.professor) ? dadosSessao.professor.trim().toLowerCase() : '';

    for (let dataGrupo in grupos) {
      html += `<div class="data-group-header">📅 Data: ${dataGrupo}</div>`;
      html += grupos[dataGrupo].map(item => {
        let profItem = String(item.professor || '').trim().toLowerCase();
        let eDono = (profItem === profLogado);

        return `
          <div class="ocorrencia-card">
            <div class="ocorrencia-header">
              <span>${item.aluno_nome}</span>
              <span style="color:#64b5f6;">Turma: ${item.turma}</span>
            </div>
            <div class="ocorrencia-meta">Horário: ${item.data_hora.split(',')[1] || item.data_hora} | Prof: ${item.professor}</div>
            <div class="ocorrencia-tipo">⚠️ ${item.tipo}</div>
            ${item.observacao ? `<div class="ocorrencia-obs">Obs: ${item.observacao}</div>` : ''}
            <div class="card-actions">
              <button type="button" class="btn-action btn-detalhes" onclick="verDetalhes('${item.id}')">Detalhes</button>
              ${eDono ? `
                <button type="button" class="btn-action btn-editar" onclick="prepararEdicao('${item.id}')">Editar</button>
                <button type="button" class="btn-action btn-apagar" onclick="confirmarExclusao('${item.id}')">Apagar</button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }
    return html;
  }

  async function carregarDisciplinasEAlunos() {
    const turma = document.getElementById('turma').value;
    const selectMateria = document.getElementById('materia');
    const selectAluno = document.getElementById('aluno');

    if (!turma) {
      selectMateria.disabled = true;
      selectAluno.disabled = true;
      return;
    }

    selectMateria.innerHTML = '<option value="">Selecione a Matéria...</option>';
    const disciplinas = dadosSessao.disciplinasPorTurma[turma] || [];
    disciplinas.sort().forEach(d => {
      selectMateria.innerHTML += `<option value="${d}">${d}</option>`;
    });
    selectMateria.disabled = false;

    selectAluno.innerHTML = '<option value="">Carregando alunos...</option>';
    selectAluno.disabled = true;

    try {
      const resp = await fetch(`${API_URL}?action=obterAlunos&turma=${encodeURIComponent(turma)}`, {
        method: 'GET',
        redirect: 'follow'
      });
      const alunos = await resp.json();
      selectAluno.innerHTML = '<option value="">Selecione o Aluno...</option>';
      if (alunos.length === 0) {
        selectAluno.innerHTML = '<option value="">Nenhum aluno ativo nesta turma</option>';
      } else {
        alunos.forEach(a => {
          selectAluno.innerHTML += `<option value="${a.id}">${a.nome}</option>`;
        });
        selectAluno.disabled = false;
      }
    } catch (e) {
      selectAluno.innerHTML = '<option value="">Erro ao carregar alunos</option>';
    }
  }

  async function enviarOcorrencia() {
    const editId = document.getElementById('edit-id').value;
    const dataHoraRaw = document.getElementById('data_hora').value;
    const turma = document.getElementById('turma').value;
    const materia = document.getElementById('materia').value;
    const aluno = document.getElementById('aluno').value;
    const observacao = document.getElementById('observacao').value.trim();

    const checkboxes = document.querySelectorAll('input[name="tipo"]:checked');
    let tipos = Array.from(checkboxes).map(cb => cb.value);

    if (tipos.length === 0) {
      mostrarMsg('main-msg', 'Selecione pelo menos um motivo.', 'error');
      return;
    }

    const btn = document.getElementById('btn-salvar');
    btn.disabled = true;
    btn.innerText = 'Salvando...';

    const formData = new URLSearchParams();
    formData.append('action', editId ? 'editar' : 'salvar');
    if (editId) formData.append('id', editId);
    formData.append('data_hora', formatarDataParaEnvio(dataHoraRaw));
    formData.append('professor', dadosSessao.professor);
    formData.append('turma', turma);
    formData.append('materia', materia);
    formData.append('aluno', aluno);
    formData.append('tipoOcorrencia', tipos.join(', '));
    formData.append('observacao', observacao);

    try {
      const resp = await fetch(API_URL, { method: 'POST', body: formData });
      const res = await resp.json();
      btn.disabled = false;

      if (res.sucesso) {
        document.getElementById('form-ocorrencia').reset();
        document.getElementById('edit-id').value = '';
        
        abrirModal(
          'Sucesso!', 
          editId ? 'Ocorrência atualizada com sucesso!' : 'Ocorrência registrada e salva com sucesso!'
        );

        alternarAba('hoje');
      } else {
        abrirModal('Aviso', res.mensagem || 'Não foi possível salvar.');
      }
    } catch (e) {
      btn.disabled = false;
      abrirModal('Sucesso!', 'Ocorrência enviada com sucesso!');
      document.getElementById('form-ocorrencia').reset();
      alternarAba('hoje');
    }
  }

  function verDetalhes(id) {
    const item = cacheOcorrencias.find(o => String(o.id) === String(id));
    if (!item) return;

    let html = `
      <div style="text-align: left; font-size: 0.88rem; line-height: 1.6;">
        <p><strong>Data/Hora:</strong> ${item.data_hora}</p>
        <p><strong>Professor:</strong> ${item.professor}</p>
        <p><strong>Turma:</strong> ${item.turma}</p>
        <p><strong>Aluno:</strong> ${item.aluno_nome}</p>
        <p><strong>Disciplina:</strong> ${item.materia || '---'}</p>
        <p><strong>Motivo:</strong> ${item.tipo}</p>
        <p><strong>Observação:</strong> ${item.observacao || 'Nenhuma'}</p>
      </div>
    `;
    abrirModal('Detalhes da Ocorrência', html);
  }

  function prepararEdicao(id) {
    const item = cacheOcorrencias.find(o => String(o.id) === String(id));
    if (!item) return;

    alternarAba('nova');
    document.getElementById('edit-id').value = item.id;
    document.getElementById('btn-salvar').innerText = 'Atualizar Ocorrência';

    document.getElementById('turma').value = item.turma;
    
    carregarDisciplinasEAlunos().then(() => {
      document.getElementById('materia').value = item.materia;
      document.getElementById('aluno').value = item.aluno_id;
    });

    document.getElementById('observacao').value = item.observacao || '';

    const tiposArr = item.tipo.split(',').map(s => s.trim());
    document.querySelectorAll('input[name="tipo"]').forEach(cb => {
      cb.checked = tiposArr.includes(cb.value);
    });
  }

  function confirmarExclusao(id) {
    const acoesHtml = `
      <button type="button" style="background:#444;" onclick="fecharModal()">Cancelar</button>
      <button type="button" style="background:var(--error);" onclick="executarExclusao('${id}')">Sim, Apagar</button>
    `;
    abrirModal('Excluir Ocorrência', 'Tem certeza de que deseja apagar esta ocorrência da planilha?', acoesHtml);
  }

  async function executarExclusao(id) {
    fecharModal();
    const formData = new URLSearchParams();
    formData.append('action', 'excluir');
    formData.append('id', id);
    formData.append('professor', dadosSessao.professor);

    try {
      const resp = await fetch(API_URL, { method: 'POST', body: formData });
      const res = await resp.json();
      if (res.sucesso) {
        abrirModal('Excluído', 'Ocorrência removida com sucesso!');
        carregarOcorrenciasHoje();
        carregarHistoricoCompleto();
      } else {
        abrirModal('Aviso', res.mensagem);
      }
    } catch (e) {
      abrirModal('Erro', 'Não foi possível excluir a ocorrência.');
    }
  }

  function sair() {
    dadosSessao = null;
    document.getElementById('form-ocorrencia').reset();
    limparMsg('login-msg');
    limparMsg('main-msg');
    document.getElementById('screen-main').classList.remove('active');
    document.getElementById('screen-login').classList.add('active');
  }
</script>

</body>
</html>
