<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conecta 193 - Ocorrências</title>
  <link rel="stylesheet" href="css/style.css">

</head>
<body>

<div class="container">
  
  <!-- TELA 1: LOGIN -->
  <div id="screen-login" class="screen active">
    <div class="header">
      <h2>Conecta 193</h2>
      <p style="font-size: 0.85rem; color: #aaa;">Acesso do Professor</p>
    </div>
    <div id="login-msg" class="msg"></div>
    <form onsubmit="event.preventDefault(); fazerLogin();">
      <div class="form-group">
        <label for="matricula">Matrícula:</label>
        <input type="text" id="matricula" placeholder="Digite sua matrícula" required>
      </div>
      <button type="submit" id="btn-login">Entrar</button>
    </form>
  </div>

  <!-- TELA PRINCIPAL (APÓS LOGIN) -->
  <div id="screen-main" class="screen">
    <div class="header">
      <h2>Conecta 193</h2>
    </div>

    <div class="prof-badge">
      <span>Prof: <strong id="prof-nome">---</strong></span>
      <button type="button" class="btn-sair" onclick="sair()">Sair</button>
    </div>

    <!-- BOTÕES DE NAVEGAÇÃO SUPERIORES (NOVA É A TELA INICIAL) -->
    <div class="nav-buttons">
      <button type="button" class="nav-btn active" id="btn-tab-nova" onclick="alternarAba('nova')">+ Nova</button>
      <button type="button" class="nav-btn" id="btn-tab-hoje" onclick="alternarAba('hoje')">Hoje</button>
      <button type="button" class="nav-btn" id="btn-tab-historico" onclick="alternarAba('historico')">Histórico</button>
    </div>

    <div id="main-msg" class="msg"></div>

    <!-- ABA 1: FORMULÁRIO DE NOVA OCORRÊNCIA (TELA INICIAL PADRÃO) -->
    <div id="tab-nova" class="tab-content">
      <form id="form-ocorrencia" onsubmit="event.preventDefault(); enviarOcorrencia();">
        <input type="hidden" id="edit-id" value="">
        <div class="form-group">
          <label for="data_hora">Data e Hora:</label>
          <input type="datetime-local" id="data_hora" required>
        </div>

        <div class="form-group">
          <label for="turma">Turma:</label>
          <select id="turma" onchange="carregarDisciplinasEAlunos()" required>
            <option value="">Selecione a Turma...</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="materia">Matéria:</label>
          <select id="materia" required disabled>
            <option value="">Selecione a Turma primeiro...</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="aluno">Aluno:</label>
          <select id="aluno" required disabled>
            <option value="">Selecione a Turma primeiro...</option>
          </select>
        </div>
        
<div class="form-group">
          <label>Motivo da Ocorrência:</label>
          <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Chegou atrasado"> Chegou atrasado</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Sem dever (casa/aula)"> Sem dever (casa/aula)</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Dever incompleto (casa/aula)"> Dever incompleto (casa/aula)</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Sem material de estudo"> Sem material de estudo</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Não entregou trabalho"> Não entregou trabalho</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Excesso de conversas"> Excesso de conversas</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Utilização de celular/fone em sala"> Utilização de celular/fone em sala</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Brigou em sala de aula"> Brigou em sala de aula</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Falta de respeito (colegas)"> Falta de respeito (colegas)</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Falta de respeito (professor)"> Falta de respeito (professor)</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Palavras inadequadas"> Palavras inadequadas</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Não acata ordens (professor)"> Não acata ordens (professor)</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Destruição de patrimônio público"> Destruição de patrimônio público</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Falta sem justificativa"> Falta sem justificativa</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Elogios / Pontos positivos"> Elogios / Pontos positivos</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Recusou participar da atividade"> Recusou participar da atividade</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Matando aula"> Matando aula</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Jogando no celular"> Jogando no celular</label>
            <label class="checkbox-item"><input type="checkbox" name="tipo" value="Jogando no Chromebook"> Jogando no Chromebook</label>
          </div>
        </div>
        
        <div class="form-group">
          <label for="observacao">Observação:</label>
          <textarea id="observacao" rows="3" placeholder="Detalhes opcionais..."></textarea>
        </div>
        
        <button type="submit" id="btn-salvar">Registrar Ocorrência</button>
      </form>
    </div>

    <!-- ABA 2: HOJE (OCORRÊNCIAS DO DIA VIGENTE) -->
    <div id="tab-hoje" class="tab-content" style="display: none;">
      <h3 style="font-size: 1rem; color: #888; margin-bottom: 10px;">Ocorrências de Hoje</h3>
      <div id="lista-hoje">Carregando ocorrências de hoje...</div>
    </div>

    <!-- ABA 3: HISTÓRICO COMPLETO AGRUPADO POR DATA -->
    <div id="tab-historico" class="tab-content" style="display: none;">
      <h3 style="font-size: 1rem; color: #888; margin-bottom: 10px;">Histórico Geral</h3>
      <div id="lista-historico">Carregando histórico...</div>
    </div>

  </div>

  
</div>

<!-- MODAL / POP-UP CUSTOMIZADO -->
<div id="modal" class="modal-overlay">
  <div class="modal-box">
    <h3 id="modal-titulo">Confirmação</h3>
    <p id="modal-texto">Mensagem aqui...</p>
    <div class="modal-buttons" id="modal-acoes">
      <button type="button" onclick="fecharModal()">OK</button>
    </div>
  </div>
</div>
</body>
<script src="js/ocorrencias.js"></script>
</html>
